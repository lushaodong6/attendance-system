<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>考勤管理系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .container { margin-top: 20px; }
    .card { margin-bottom: 20px; }
  </style>
</head>
<body>
<div class="container">
  <h2 class="mb-4">📅 考勤打卡系统</h2>

  <!-- 提示消息 -->
  <div th:if="${message}" class="alert alert-info alert-dismissible fade show" role="alert">
    <span th:text="${message}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <!-- 打卡区域 -->
  <div class="card">
    <div class="card-header">✅ 打卡操作</div>
    <div class="card-body">
      <form method="post" th:action="@{/signin}" class="row g-3">
        <div class="col-md-4">
          <label>选择课程</label>
          <select name="courseId" class="form-select" required>
            <option value="">--请选择--</option>
            <option th:each="c : ${courses}" th:value="${c.id}" th:text="${c.name}"></option>
          </select>
        </div>
        <div class="col-md-4">
          <label>学生姓名</label>
          <input type="text" name="studentName" class="form-control" required>
        </div>
        <div class="col-md-4 d-flex align-items-end">
          <button type="submit" class="btn btn-primary">⏰ 签到</button>
        </div>
      </form>
      <hr>
      <small class="text-muted">⏱️ 签到时间限制：课程开始前15分钟 ～ 开始后30分钟。系统自动判断迟到/早退。</small>
    </div>
  </div>

  <!-- 筛选区域 -->
  <div class="card">
    <div class="card-header">🔍 筛选考勤记录</div>
    <div class="card-body">
      <form method="get" action="/" class="row g-3">
        <div class="col-md-3">
          <label>课程筛选</label>
          <select name="courseId" class="form-select">
            <option value="">全部课程</option>
            <option th:each="c : ${courses}" th:value="${c.id}" th:text="${c.name}"
                    th:selected="${selectedCourseId != null && selectedCourseId == c.id}"></option>
          </select>
        </div>
        <div class="col-md-3">
          <label>快速时间段</label>
          <select name="period" class="form-select">
            <option value="">全部</option>
            <option value="today" th:selected="${selectedPeriod == 'today'}">今天</option>
            <option value="week" th:selected="${selectedPeriod == 'week'}">本周</option>
            <option value="month" th:selected="${selectedPeriod == 'month'}">本月</option>
          </select>
        </div>
        <div class="col-md-2 d-flex align-items-end">
          <button type="submit" class="btn btn-secondary">筛选</button>
        </div>
        <div class="col-md-2 d-flex align-items-end">
          <a th:href="@{/export(courseId=${selectedCourseId}, period=${selectedPeriod})}" class="btn btn-success">📎 导出 CSV</a>
        </div>
      </form>
    </div>
  </div>

  <!-- 考勤记录表格 -->
  <div class="card">
    <div class="card-header">📋 考勤记录列表</div>
    <div class="card-body">
      <table class="table table-bordered table-striped">
        <thead>
        <tr>
          <th>学生</th>
          <th>课程</th>
          <th>签到时间</th>
          <th>签退时间</th>
          <th>迟到</th>
          <th>早退</th>
          <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="att : ${attendances}">
          <td th:text="${att.studentName}"></td>
          <td th:text="${att.course.name}"></td>
          <td th:text="${#temporals.format(att.signInTime, 'yyyy-MM-dd HH:mm:ss')}"></td>
          <td th:if="${att.signOutTime != null}" th:text="${#temporals.format(att.signOutTime, 'yyyy-MM-dd HH:mm:ss')}"></td>
          <td th:unless="${att.signOutTime != null}">未签退</td>
          <td th:text="${att.late ? '是' : '否'}"></td>
          <td th:text="${att.earlyLeave ? '是' : '否'}"></td>
          <td>
            <form th:if="${att.signOutTime == null}" method="post" th:action="@{/signout/{id}(id=${att.id})}">
              <button type="submit" class="btn btn-sm btn-warning">签退</button>
            </form>
            <span th:unless="${att.signOutTime == null}" class="text-success">已完成</span>
          </td>
        </tr>
        <tr th:if="${attendances.isEmpty()}">
          <td colspan="7" class="text-center">暂无考勤记录</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
